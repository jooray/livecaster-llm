[project]
name = "livecaster"
version = "0.1.0"
description = "Live podcast co-pilot: local transcription plus an LLM that keeps the outline map honest."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "numpy>=1.26",
  "sounddevice>=0.4.7",
  "soundfile>=0.12",
  "soxr>=0.4",
  "pysilero-vad>=2.0",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "watchfiles>=0.22",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "unidecode>=1.3",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
mac = ["parakeet-mlx>=0.3"]
# Only needed to bill Anthropic directly (`--set llm.final_model=anthropic:claude-sonnet-5`).
# Claude through Venice needs nothing extra.
anthropic = ["anthropic>=1.0"]
# Opt-in: mlx-whisper depends on PyTorch, which the macOS install deliberately avoids.
# Install it only when you need the Whisper fallback (a language outside Parakeet's 25).
mac-whisper = ["mlx-whisper>=0.4"]
linux = ["onnx-asr[cpu]>=0.6", "faster-whisper>=1.0"]
cuda = ["onnx-asr[gpu]>=0.6", "faster-whisper>=1.0"]

[project.scripts]
livecaster = "livecaster.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "websockets>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livecaster"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Third-party deprecations are noise; our own are bugs to fix.
filterwarnings = ["ignore::DeprecationWarning", "error::DeprecationWarning:livecaster.*"]
# Integration tests hit the network or download models; run them with `-m integration`.
addopts = "-m 'not integration'"
markers = [
  "integration: talks to Venice or loads a real STT model",
  "slow: takes more than a few seconds",
]
